  FinanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.consolidated.finance_handler
      Policies:
      - Statement:
        - Effect: Allow
          Action: dynamodb:PutItem
          Resource:
            Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-audit-events-${Environment}
      - DynamoDBReadPolicy:
