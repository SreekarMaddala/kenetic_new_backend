      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-organizations-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-users-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-projects-${Environment}
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-site-activity-${Environment}
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-workforce-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-payroll-${Environment}
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-reporting-${Environment}
      - Statement:
        - Effect: Allow
          Action: dynamodb:ConditionCheckItem
          Resource:
            Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-payroll-${Environment}
      - Statement:
        - Effect: Allow
