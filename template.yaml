      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-users-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-projects-${Environment}
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-finance-${Environment}
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-reporting-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-inventory-${Environment}
      - DynamoDBReadPolicy:
          TableName:
