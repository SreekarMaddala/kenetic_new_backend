            Path: /super-admin/{proxy+}
            Method: ANY
        RoutesOptions:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /super-admin/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        EmployeesRoot:
