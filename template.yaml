AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kinetic ERP v2 — 12 domain Lambdas using 12 externally managed DynamoDB tables
Parameters:
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  FrontendOrigin:
    Type: String
    Default: '*'
    Description: Exact frontend HTTPS origin (no trailing slash) or '*'
  OrganizationsTable:
    Type: String
    Default: kinetic-v2-organizations
  UsersTable:
    Type: String
    Default: kinetic-v2-users
  ProjectsTable:
    Type: String
    Default: kinetic-v2-projects
  PartiesTable:
    Type: String
    Default: kinetic-v2-parties
  FieldOperationsTable:
    Type: String
    Default: kinetic-v2-field-operations
  SiteControlTable:
    Type: String
    Default: kinetic-v2-site-control
  MaterialsLogisticsTable:
    Type: String
    Default: kinetic-v2-materials-logistics
  DocumentControlTable:
    Type: String
    Default: kinetic-v2-document-control
  InventoryTable:
    Type: String
    Default: kinetic-v2-inventory
  FinanceTable:
    Type: String
    Default: kinetic-v2-finance
  SettingsTable:
    Type: String
    Default: kinetic-v2-settings
  AuditEventsTable:
    Type: String
    Default: kinetic-v2-audit-events
Globals:
  Function:
    CodeUri: ./
    Runtime: python3.13
    Handler: handlers.consolidated.placeholder
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        ORGANIZATIONS_TABLE:
          Ref: OrganizationsTable
        USERS_TABLE:
          Ref: UsersTable
        PROJECTS_TABLE:
          Ref: ProjectsTable
        PARTIES_TABLE:
          Ref: PartiesTable
        FIELD_OPERATIONS_TABLE:
          Ref: FieldOperationsTable
        SITE_CONTROL_TABLE:
          Ref: SiteControlTable
        MATERIALS_LOGISTICS_TABLE:
          Ref: MaterialsLogisticsTable
        DOCUMENT_CONTROL_TABLE:
          Ref: DocumentControlTable
        INVENTORY_TABLE:
          Ref: InventoryTable
        FINANCE_TABLE:
          Ref: FinanceTable
        SETTINGS_TABLE:
          Ref: SettingsTable
        AUDIT_EVENTS_TABLE:
          Ref: AuditEventsTable
        DOCUMENTS_BUCKET:
          Ref: DocumentsBucket
        COGNITO_CLIENT_ID:
          Ref: CognitoClientId
        COGNITO_USER_POOL_ID:
          Ref: CognitoUserPoolId
Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - Ref: FrontendOrigin
          AllowedMethods: [GET, POST]
          AllowedHeaders: ['*']
          MaxAge: 300
  KineticHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
        - Ref: FrontendOrigin
        AllowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Audience:
              - Ref: CognitoClientId
              Issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
        DefaultAuthorizer: CognitoJwt
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.consolidated.auth_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: OrganizationsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: UsersTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProjectsTable
      Events:
        Routes:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /auth/{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoJwt
        OptionsAuthRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /auth/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        OptionsGlobalRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
  PlatformAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.consolidated.platform_admin_handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminCreateUser
          - cognito-idp:AdminAddUserToGroup
          - cognito-idp:AdminDeleteUser
          - cognito-idp:AdminDisableUser
          - cognito-idp:AdminEnableUser
          - cognito-idp:AdminUserGlobalSignOut
          Resource:
            Fn::Sub: arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      - DynamoDBReadPolicy:
          TableName:
            Ref: OrganizationsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: UsersTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: ProjectsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: OrganizationsTable
      - DynamoDBCrudPolicy:
