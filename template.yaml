          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-projects-${Environment}
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-vendors-contractors-${Environment}
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-reporting-${Environment}
      Events:
        BoqRoot:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/boq
            Method: ANY
        Boq:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/boq/{proxy+}
            Method: ANY
        SubcontractorsRoot:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/subcontractors
            Method: ANY
        Subcontractors:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/subcontractors/{proxy+}
            Method: ANY
        SubcontractorRegistry:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /subcontractors
            Method: ANY
        SubcontractorRegistryItem:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /subcontractors/{proxy+}
            Method: ANY
        MilestonesRoot:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/milestones
            Method: ANY
        Milestones:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/milestones/{proxy+}
            Method: ANY
      FunctionName:
        Fn::Sub: ${ProjectName}-project-commercial-${Environment}
