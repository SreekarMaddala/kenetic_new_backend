              Ref: KineticHttpApi
            Path: /projects/{projectId}/issues
            Method: ANY
        Issues:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /projects/{projectId}/issues/{proxy+}
