AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kinetic ERP - 11 request handlers using 16 domain tables
Parameters:
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  FrontendOrigin:
    Type: String
    Default: https://kenetic-new-frontend.vercel.app
    Description: Exact frontend HTTPS origin (no trailing slash) or '*'
  ProjectName:
    Type: String
    Default: kinetic-erp
    AllowedPattern: '[a-z][a-z0-9-]{1,29}'
    MaxLength: 30
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
Globals:
  Function:
    CodeUri: ./
    Runtime: python3.13
    Handler: handlers.consolidated.placeholder
    Timeout: 20
    MemorySize: 256
    Environment:
      Variables:
        ORGANIZATIONS_TABLE:
          Fn::Sub: ${ProjectName}-organizations-${Environment}
        USERS_TABLE:
          Fn::Sub: ${ProjectName}-users-${Environment}
        PROJECTS_TABLE:
          Fn::Sub: ${ProjectName}-projects-${Environment}
        PARTIES_TABLE:
          Fn::Sub: ${ProjectName}-vendors-contractors-${Environment}
        FIELD_OPERATIONS_TABLE:
          Fn::Sub: ${ProjectName}-site-activity-${Environment}
        SITE_CONTROL_TABLE:
          Fn::Sub: ${ProjectName}-site-control-${Environment}
        DOCUMENT_CONTROL_TABLE:
          Fn::Sub: ${ProjectName}-documents-${Environment}
        INVENTORY_TABLE:
          Fn::Sub: ${ProjectName}-inventory-${Environment}
        FINANCE_TABLE:
          Fn::Sub: ${ProjectName}-finance-${Environment}
        SETTINGS_TABLE:
          Fn::Sub: ${ProjectName}-settings-${Environment}
        AUDIT_EVENTS_TABLE:
          Fn::Sub: ${ProjectName}-audit-events-${Environment}
        DOCUMENTS_BUCKET:
          Ref: DocumentsBucket
        COGNITO_CLIENT_ID:
          Ref: CognitoClientId
        COGNITO_USER_POOL_ID:
          Ref: CognitoUserPoolId
        WORKFORCE_TABLE:
          Fn::Sub: ${ProjectName}-workforce-${Environment}
        PAYROLL_TABLE:
          Fn::Sub: ${ProjectName}-payroll-${Environment}
        TRANSPORT_TABLE:
          Fn::Sub: ${ProjectName}-transport-${Environment}
        REPORTING_TABLE:
          Fn::Sub: ${ProjectName}-reporting-${Environment}
        MATERIALS_TABLE:
          Fn::Sub: ${ProjectName}-materials-${Environment}
    Tags:
      Application:
        Ref: ProjectName
      Environment:
        Ref: Environment
Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
        - AllowedOrigins:
          - Ref: FrontendOrigin
          - http://localhost:5173
          AllowedMethods:
          - GET
          - POST
          AllowedHeaders:
          - '*'
          MaxAge: 300
      LifecycleConfiguration:
        Rules:
        - Id: ExpireReportExports
          Status: Enabled
          Prefix: exports/
          ExpirationInDays: 30
  KineticHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: Environment
      CorsConfiguration:
        AllowOrigins:
        - Ref: FrontendOrigin
        - http://localhost:5173
        AllowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        MaxAge: 300
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Audience:
              - Ref: CognitoClientId
              Issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
        DefaultAuthorizer: CognitoJwt
      Name:
        Fn::Sub: ${ProjectName}-api-${Environment}
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.consolidated.auth_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-organizations-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-users-${Environment}
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${ProjectName}-projects-${Environment}
      Events:
        Routes:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: KineticHttpApi
            Path: /auth/{proxy+}
            Method: GET
            Auth:
              Authorizer: CognitoJwt
      FunctionName:
        Fn::Sub: ${ProjectName}-auth-${Environment}
  PlatformAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.consolidated.platform_admin_handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminCreateUser
